spring:
  datasource:
    url: jdbc:h2:mem:finzy_test_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never

finzy:
  cors:
    allowed-origins: http://localhost:3000
