spring:
  application:
    name: finzy-client-portal
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    context-path: /api/v1
    session:
      cookie:
        name: FINZY_ADMIN_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

finzy:
  cors:
    allowed-origins: http://localhost:3000
  portal:
    token-expiry-days: 90
    base-url: http://localhost:3000
