services:
  postgres:
    image: postgres:16-alpine
    container_name: finzy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finzy_portal
      POSTGRES_USER: finzy
      POSTGRES_PASSWORD: finzy_dev_password
    volumes:
      - finzy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finzy -d finzy_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: finzy-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  finzy_postgres_data:
